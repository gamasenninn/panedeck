<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    PaneDeck のアイコン。

    グリッドに並んだ 4 つのペインを表す。1 つだけ琥珀色にしてあるのは
    「入力待ちのペインが一目で分かる」というこのアプリの主機能そのもの。
    残りの 3 つは実行中・待機の見え方に寄せた。
    配色は UI と同じ GitHub ダーク系で揃えている。
  -->
  <defs>
    <clipPath id="rounded">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="512" height="512" fill="#0d1117" />

    <!-- 枠 -->
    <rect
      x="8"
      y="8"
      width="496"
      height="496"
      rx="104"
      ry="104"
      fill="none"
      stroke="#30363d"
      stroke-width="16"
    />

    <!-- 左上: 実行中 -->
    <g>
      <rect x="88" y="96" width="152" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="6" />
      <rect x="88" y="96" width="152" height="30" rx="18" fill="#0d419d" />
      <rect x="88" y="112" width="152" height="14" fill="#0d419d" />
      <rect x="110" y="152" width="88" height="12" rx="6" fill="#79c0ff" />
      <rect x="110" y="180" width="60" height="12" rx="6" fill="#3d444d" />
      <rect x="110" y="208" width="74" height="12" rx="6" fill="#3d444d" />
    </g>

    <!-- 右上: 入力待ち（このアプリが見つけたいもの） -->
    <g>
      <rect x="272" y="96" width="152" height="140" rx="18" fill="#161b22" stroke="#ffd33d" stroke-width="8" />
      <rect x="272" y="96" width="152" height="30" rx="18" fill="#7d4e00" />
      <rect x="272" y="112" width="152" height="14" fill="#7d4e00" />
      <rect x="294" y="176" width="14" height="34" rx="4" fill="#ffd33d" />
      <rect x="322" y="192" width="80" height="12" rx="6" fill="#ffd33d" opacity="0.55" />
    </g>

    <!-- 左下: 待機 -->
    <g>
      <rect x="88" y="276" width="152" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="6" />
      <rect x="88" y="276" width="152" height="30" rx="18" fill="#21262d" />
      <rect x="88" y="292" width="152" height="14" fill="#21262d" />
      <rect x="110" y="332" width="70" height="12" rx="6" fill="#3d444d" />
      <rect x="110" y="360" width="94" height="12" rx="6" fill="#3d444d" />
    </g>

    <!-- 右下: 実行中 -->
    <g>
      <rect x="272" y="276" width="152" height="140" rx="18" fill="#161b22" stroke="#30363d" stroke-width="6" />
      <rect x="272" y="276" width="152" height="30" rx="18" fill="#0d419d" />
      <rect x="272" y="292" width="152" height="14" fill="#0d419d" />
      <rect x="294" y="332" width="100" height="12" rx="6" fill="#79c0ff" />
      <rect x="294" y="360" width="56" height="12" rx="6" fill="#3d444d" />
    </g>
  </g>
</svg>

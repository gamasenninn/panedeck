<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>PaneDeck</title>
    <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #0d1117;
        color: #e6edf3;
        font-family: "Segoe UI", -apple-system, sans-serif;
        font-size: 13px;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      /* --- ツールバー --- */
      #toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
        flex-shrink: 0;
      }

      #toolbar h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-right: 6px;
      }

      #toolbar h1 span {
        color: #58a6ff;
      }

      button {
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 6px 12px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #30363d;
        border-color: #8b949e;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      button.primary {
        background: #238636;
        border-color: #2ea043;
      }

      button.primary:hover:not(:disabled) {
        background: #2ea043;
      }

      button.danger:hover:not(:disabled) {
        background: #6e2530;
        border-color: #f85149;
      }

      input[type="text"] {
        background: #0d1117;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        font-family: inherit;
      }

      input[type="text"]:focus {
        outline: none;
        border-color: #58a6ff;
      }

      input[type="number"] {
        background: #0d1117;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 6px 4px 6px 8px;
        font-size: 12px;
        font-family: inherit;
        width: 58px;
      }

      input[type="number"]:focus {
        outline: none;
        border-color: #58a6ff;
      }

      select {
        background: #0d1117;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }

      select:focus {
        outline: none;
        border-color: #58a6ff;
      }

      .spacer {
        flex: 1;
      }

      #session-count {
        color: #8b949e;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      /* ネイティブの alert はテストを止めてしまうので、通知はここに出す */
      #message {
        font-size: 12px;
        max-width: 380px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #ff7b72;
      }

      #message.info {
        color: #3fb950;
      }

      .field {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #8b949e;
        font-size: 12px;
      }

      label.field {
        cursor: pointer;
        white-space: nowrap;
        user-select: none;
      }

      /* ログを書き続けていることの印。設定へ隠した分をここで補う */
      #auto-log-indicator {
        color: #d29922;
        font-size: 11px;
        white-space: nowrap;
      }

      #auto-log-indicator[hidden] {
        display: none;
      }

      /* --- 設定ダイアログ --- */
      #settings-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(1, 4, 9, 0.72);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }

      #settings-backdrop[hidden] {
        display: none;
      }

      #settings-dialog {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 10px;
        padding: 18px 22px 16px;
        width: min(560px, 92vw);
        max-height: 86vh;
        overflow-y: auto;
      }

      #settings-dialog h2 {
        font-size: 15px;
        margin-bottom: 4px;
      }

      #settings-dialog h3 {
        font-size: 12px;
        color: #8b949e;
        border-bottom: 1px solid #30363d;
        padding-bottom: 4px;
        margin: 16px 0 10px;
        font-weight: 600;
      }

      #settings-dialog .setting {
        margin-bottom: 12px;
      }

      #settings-dialog .setting > label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }

      #settings-dialog label.checkbox {
        display: flex;
        align-items: center;
        gap: 7px;
        cursor: pointer;
        user-select: none;
      }

      #settings-dialog .row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      #settings-dialog .row input[type="text"] {
        flex: 1;
        min-width: 0;
      }

      #settings-dialog .hint {
        color: #6e7681;
        font-size: 11px;
        margin-top: 4px;
        line-height: 1.5;
      }

      .settings-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 18px;
      }

      /* --- グリッド --- */
      #grid {
        flex: 1;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        grid-auto-rows: minmax(260px, 1fr);
        gap: 10px;
        padding: 10px;
      }

      #grid.empty {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #empty-state {
        color: #8b949e;
        text-align: center;
        line-height: 1.9;
      }

      #empty-state code {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 4px;
        padding: 1px 6px;
        font-family: "Cascadia Code", Consolas, monospace;
      }

      /* --- ペイン --- */
      .pane {
        display: flex;
        flex-direction: column;
        background: #010409;
        border: 1px solid #30363d;
        border-radius: 8px;
        overflow: hidden;
        min-height: 0;
      }

      .pane.focused {
        border-color: #58a6ff;
      }

      /* 1 ペインだけを全面に出す。他は隠すだけで、閉じてはいない */
      #grid.maximized {
        grid-template-columns: 1fr !important;
        grid-auto-rows: 1fr;
      }

      #grid.maximized .pane:not(.maximized) {
        display: none;
      }

      /* 並べ替え中のペインと、落とし先の目印 */
      .pane.dragging {
        opacity: 0.45;
      }

      .pane.drop-before {
        box-shadow: inset 3px 0 0 #58a6ff;
      }

      .pane.drop-after {
        box-shadow: inset -3px 0 0 #58a6ff;
      }

      /* ヘッダを掴んで動かす。端末の上でのドラッグは選択の邪魔になる */
      .pane-header {
        cursor: grab;
      }

      .pane.dragging .pane-header {
        cursor: grabbing;
      }

      .pane-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
        flex-shrink: 0;
      }

      .pane-title {
        font-weight: 600;
        white-space: nowrap;
      }

      .pane-cwd {
        color: #6e7681;
        font-size: 11px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        min-width: 0;
      }

      /* どのエージェントで起動したペインかを示す（#1: セッションごとの起動コマンド） */
      .pane-command {
        color: #a5d6ff;
        background: #0d1117;
        border: 1px solid #21262d;
        border-radius: 4px;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 10px;
        padding: 1px 6px;
        max-width: 160px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex-shrink: 0;
      }

      /* 起動コマンドが無いペインでは枠ごと消す */
      .pane-command:empty {
        display: none;
      }

      .pane-status {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .pane-status[data-status="running"] {
        background: #0d419d;
        color: #79c0ff;
      }

      .pane-status[data-status="waiting"] {
        background: #7d4e00;
        color: #ffd33d;
      }

      /* 指示待ち: 打った文字は指示になる。落ち着いた色で「送ってよい」を示す */
      .pane-status[data-status="ready"] {
        background: #0f5323;
        color: #7ee787;
      }

      /* 確認待ち: 打鍵がそのまま回答になる。最も目立たせる */
      .pane-status[data-status="asking"] {
        background: #9e4c00;
        color: #ffd33d;
        font-weight: 600;
      }

      .pane-status[data-status="idle"] {
        background: #21262d;
        color: #8b949e;
      }

      .pane-status[data-status="exited"] {
        background: #67060c;
        color: #ff7b72;
      }

      .pane-header button {
        padding: 2px 7px;
        font-size: 11px;
        flex-shrink: 0;
      }

      .pane-body {
        flex: 1;
        min-height: 0;
        padding: 4px;
      }

      .pane-body .xterm {
        height: 100%;
      }

      /* --- ブロードキャストバー --- */
      #broadcast-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #161b22;
        border-top: 1px solid #30363d;
        flex-shrink: 0;
      }

      #broadcast-input {
        flex: 1;
      }

      #broadcast-target {
        color: #8b949e;
        font-size: 12px;
        white-space: nowrap;
      }

      #keys {
        display: flex;
        gap: 4px;
      }

      #keys button {
        padding: 5px 9px;
        font-family: "Cascadia Code", Consolas, monospace;
        font-size: 11px;
      }

      .divider {
        width: 1px;
        height: 22px;
        background: #30363d;
      }
    </style>
  </head>
  <body>
    <header id="toolbar">
      <h1>Pane<span>Deck</span></h1>

      <div class="field">
        <label for="agent-select">エージェント</label>
        <select id="agent-select" data-testid="agent-select"></select>
      </div>

      <div class="field">
        <label for="launch-command">起動コマンド</label>
        <input
          type="text"
          id="launch-command"
          data-testid="launch-command"
          value="claude"
          size="12"
        />
      </div>

      <button id="add-session" class="primary" data-testid="add-session">
        + セッション追加
      </button>

      <div class="divider"></div>

      <button id="save-workspace" data-testid="save-workspace">構成を保存</button>
      <button id="restore-workspace" data-testid="restore-workspace">
        構成を復元
      </button>

      <button id="open-settings" data-testid="open-settings" title="設定">
        ⚙ 設定
      </button>

      <div class="spacer"></div>

      <!--
        設定はダイアログへ隠したが、ログを書き続けていることだけは見えるようにする。
        気づかないままディスクへ溜まるのを避けるため
      -->
      <span
        id="auto-log-indicator"
        data-testid="auto-log-indicator"
        title="ログを自動保存しています"
        hidden
        >● ログ記録中</span
      >

      <span id="message" data-testid="message"></span>
      <span id="session-count" data-testid="session-count">0 セッション</span>
      <button id="close-all" class="danger" data-testid="close-all">全終了</button>
    </header>

    <main id="grid" class="empty" data-testid="grid">
      <div id="empty-state" data-testid="empty-state">
        セッションがありません。<br />
        <strong>+ セッション追加</strong> でディレクトリを選ぶと、そこで
        <code>claude</code> が起動します。
      </div>
    </main>

    <!--
      設定ダイアログ。別ウィンドウにしていないのは preload と IPC がもう一組
      増えるため。ネイティブモーダルは E2E をブロックするので使えない
    -->
    <div id="settings-backdrop" data-testid="settings-backdrop" hidden>
      <div
        id="settings-dialog"
        data-testid="settings-dialog"
        role="dialog"
        aria-labelledby="settings-title"
      >
        <h2 id="settings-title">設定</h2>

        <section>
          <h3>表示</h3>

          <div class="setting">
            <label for="font-size">文字サイズ</label>
            <input
              type="number"
              id="font-size"
              data-testid="font-size"
              min="8"
              max="32"
              step="1"
            />
            <p class="hint">端末の文字の大きさ (8〜32)</p>
          </div>

          <div class="setting">
            <label for="columns">列数</label>
            <select id="columns" data-testid="columns">
              <option value="0">自動</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
            <p class="hint">自動は幅に合わせて折り返す</p>
          </div>
        </section>

        <section>
          <h3>起動</h3>

          <div class="setting">
            <label class="checkbox" for="auto-restore">
              <input type="checkbox" id="auto-restore" data-testid="auto-restore" />
              前回のセッション構成を復元する
            </label>
            <p class="hint">
              無効にしても構成の記録は続くので、戻せばまた復元できる
            </p>
          </div>
        </section>

        <section>
          <h3>ログ</h3>

          <div class="setting">
            <label class="checkbox" for="auto-log">
              <input type="checkbox" id="auto-log" data-testid="auto-log" />
              出力をファイルへ自動保存する
            </label>
          </div>

          <div class="setting">
            <label for="log-dir">出力先</label>
            <div class="row">
              <input
                type="text"
                id="log-dir"
                data-testid="log-dir"
                readonly
                placeholder="（既定の場所）"
              />
              <button id="pick-log-dir" data-testid="pick-log-dir">選択</button>
              <button id="clear-log-dir" data-testid="clear-log-dir">既定に戻す</button>
            </div>
          </div>

          <div class="setting">
            <label class="checkbox" for="log-strip-ansi">
              <input
                type="checkbox"
                id="log-strip-ansi"
                data-testid="log-strip-ansi"
              />
              色や制御文字を落として保存する
            </label>
            <p class="hint">後から読むなら有効のまま。生の出力が要るときだけ外す</p>
          </div>

          <div class="setting">
            <label for="log-retention-days">保持日数</label>
            <input
              type="number"
              id="log-retention-days"
              data-testid="log-retention-days"
              min="0"
              step="1"
            />
            <p class="hint">0 なら期間では消さない</p>
          </div>

          <div class="setting">
            <label for="log-max-total-mb">合計サイズの上限 (MB)</label>
            <input
              type="number"
              id="log-max-total-mb"
              data-testid="log-max-total-mb"
              min="0"
              step="1"
            />
            <p class="hint">
              0 なら容量では消さない。超えた分は古い順に消える。
              <strong>PaneDeck が作ったログだけが対象</strong>
            </p>
          </div>
        </section>

        <div class="settings-actions">
          <button id="close-settings" data-testid="close-settings" class="primary">
            閉じる
          </button>
        </div>
      </div>
    </div>

    <footer id="broadcast-bar">
      <label class="field" for="waiting-only">
        <input type="checkbox" id="waiting-only" data-testid="waiting-only" />
        入力待ちのみ
      </label>

      <span id="broadcast-target" data-testid="broadcast-target">送信先: 全 0 ペイン</span>
      <input
        type="text"
        id="broadcast-input"
        data-testid="broadcast-input"
        placeholder="選択中のペインへまとめて送信（未選択なら全ペイン）"
      />
      <button id="broadcast-send" class="primary" data-testid="broadcast-send">
        送信
      </button>

      <div class="divider"></div>

      <div id="keys">
        <button data-key="enter" data-testid="key-enter">Enter</button>
        <!--
          中断は「入力待ちのみ」を無視して送る。止めたいのは動いている
          ペインで、入力待ちのペインは何も実行していないため（#25）
        -->
        <button
          data-key="esc"
          data-testid="key-esc"
          title="中断。「入力待ちのみ」は無視して送ります（選択があればその範囲）"
        >
          Esc
        </button>
        <button
          data-key="ctrl-c"
          data-testid="key-ctrl-c"
          title="中断。「入力待ちのみ」は無視して送ります（選択があればその範囲）"
        >
          Ctrl+C
        </button>
        <button data-key="up" data-testid="key-up">↑</button>
        <button data-key="down" data-testid="key-down">↓</button>
      </div>
    </footer>

    <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script type="module" src="dist/renderer.js"></script>
  </body>
</html>

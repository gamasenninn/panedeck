# 型検査・ビルド・単体・E2E をまとめて回す（npm test と同じ）。
#
# Windows で回すのは、pty が ConPTY の上に乗っていて、実際に痛い不具合が
# そこで出てきたため（#16）。E2E はウィンドウを画面外に置くので、
# 追加の表示設定は要らない。
#
# パッケージ版（npm run test:packaged）も回す。
#
# 以前は「インストーラを作るぶん遅い」として外していたが、**事実と違った** ——
# `pack` は `electron-builder --dir` でインストーラを作らない。実測で
# pack 6 秒 + 試験 5 秒。
#
# 外していた間に試験が腐った: 設定がツールバーからダイアログへ移った時点で
# 「設定を読み書きできる」はダイアログを開かずに触り続けていて、**誰にも
# 気づかれないまま壊れていた**（2026-10-05 に発見）。
#
# ★ パッケージ版でしか壊れない形がある: main が使う npm の依存（#31 の
# `@xterm/headless`）が asar に入らなければ、開発では動くのにパッケージ版
# だけ画面を持てない。**回していなければ分からない。**
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # node-pty は N-API のプリビルドを同梱しているので再ビルドは要らない
      - run: npm ci

      - run: npm test

      # パッケージ版。開発では通るのにここだけ落ちる形を捕まえる
      - run: npm run test:packaged

      # README の gif の収録。**主張があるので試験として働く** ——
      # 状態の呼び方が変わったのに説明文が古いまま、を捕まえる（2 か月
      # 気づかなかったことがある）。gif の書き出し（npm run demo の後半）は
      # 手元のまま。23 秒
      - run: npx playwright test --project=demo

      # 落ちたときだけレポートを残す。E2E の失敗は手元で再現しにくい
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

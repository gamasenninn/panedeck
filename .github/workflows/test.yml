# 型検査・ビルド・単体・E2E をまとめて回す（npm test と同じ）。
#
# Windows で回すのは、pty が ConPTY の上に乗っていて、実際に痛い不具合が
# そこで出てきたため（#16）。E2E はウィンドウを画面外に置くので、
# 追加の表示設定は要らない。
#
# パッケージ版の検証（npm run test:packaged）はインストーラを作るぶん遅いので
# ここには入れていない。手元か、必要になったら別ワークフローで。
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node-pty は N-API のプリビルドを同梱しているので再ビルドは要らない
      - run: npm ci

      - run: npm test

      # 落ちたときだけレポートを残す。E2E の失敗は手元で再現しにくい
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
